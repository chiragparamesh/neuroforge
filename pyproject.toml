[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge"
version = "0.1.0"
description = "A deep learning framework built from scratch in pure NumPy: autograd engine, neural network layers, optimizers, a GPT transformer, a BPE tokenizer and a live training dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chirag (chiragparamesh)" }]
keywords = ["deep-learning", "autograd", "transformer", "gpt", "numpy", "from-scratch", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
plot = ["matplotlib"]

[project.scripts]
neuroforge = "neuroforge.cli:main"

[project.urls]
Homepage = "https://github.com/chiragparamesh/neuroforge"
Repository = "https://github.com/chiragparamesh/neuroforge"

[tool.setuptools.packages.find]
include = ["neuroforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
